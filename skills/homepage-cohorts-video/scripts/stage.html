<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Cohort Video Stage</title>
<!--
  Scene library for the cohort videos. render.js loads this page, calls init() with the
  storyboard, the capture index, the Sankey SVG and the review, then render(sceneIndex, t)
  for every frame. Deterministic: the frame at time t depends only on t.
  Times in a scene (`at`) are a cue name from the narration ({cue}) or seconds.
-->
<style>
:root { --dark: #221a4c; --dark2: #342a72; --accent: #f2715a; --ink: #15112e; --soft: #cfcbe8; --font: 'Source Sans 3', system-ui, sans-serif; --serif: 'Source Serif 4', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--dark); }
body { font-family: var(--font); color: #fff; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(1400px 900px at 70% 10%, var(--dark2) 0%, var(--dark) 60%, #120d2c 100%); }
.layer { position: absolute; inset: 0; display: none; }

/* title */
.card-title { position: absolute; left: 200px; right: 200px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
.kicker { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.h1 { font-family: var(--serif); font-size: 100px; line-height: 1.05; font-weight: 600; margin-top: 18px; }
.h1 em { font-style: normal; color: var(--accent); }
.sub { font-size: 34px; color: var(--soft); margin-top: 30px; max-width: 1300px; line-height: 1.35; }

/* browser */
.browser { position: absolute; left: 160px; top: 84px; width: 1600px; height: 944px; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.bar { height: 44px; background: #f1f0f6; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #dcdbe6; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #d4d2df; }
.url { margin-left: 18px; flex: 0 1 900px; height: 28px; border-radius: 14px; background: #fff; color: #555; font-size: 15px; display: flex; align-items: center; padding: 0 16px; white-space: nowrap; overflow: hidden; }
.vp { position: relative; width: 1600px; height: 900px; overflow: hidden; background: #fff; }
.vp .pg { position: absolute; inset: 0; }
.vp .pg img.page { position: absolute; left: 0; top: 0; width: 1600px; }
.vp .pg .hdr { position: absolute; left: 0; top: 0; width: 1600px; overflow: hidden; z-index: 2; }
.vp .pg .hdr img { width: 1600px; display: block; }
.dim { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(18,13,44,.8); z-index: 4; }
.cards { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 40px; justify-content: center; align-items: center; }
.stat { width: 420px; padding: 34px 36px 38px; border-radius: 16px; background: #fff; color: var(--ink); }
.stat .n { font-family: var(--serif); font-size: 96px; line-height: 1; color: var(--accent); font-weight: 600; }
.stat .t { margin-top: 14px; font-size: 30px; font-weight: 600; line-height: 1.2; }
.stat.muted .n { color: #8a86a6; }
.chip { position: absolute; top: 26px; height: 42px; padding: 0 18px; border-radius: 21px; display: flex; align-items: center; font-size: 21px; font-weight: 600; white-space: nowrap; }
.chip.label { left: 160px; background: #fff; color: var(--dark); }
.chip.label b { color: var(--accent); margin-right: 10px; }
.chip.sig { right: 160px; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3); font-family: ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 500; max-width: 1000px; overflow: hidden; }
.ring { position: absolute; border: 4px solid var(--accent); border-radius: 12px; z-index: 8; box-shadow: 0 0 0 6px rgba(242,113,90,.25); }

/* stats on the background */
.stats-bg { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 50px; }
.stats-bg .ttl { font-family: var(--serif); font-size: 64px; font-weight: 600; }
.stats-bg .row { display: flex; gap: 40px; }

/* sankey */
.sk { background: #fff; }
.sk svg { position: absolute; left: 75px; top: 0; width: 1770px; height: 1080px; }
.sk .flow { fill: none; mix-blend-mode: multiply; }
.sk .foot { display: none; }
.sk-intro { position: absolute; left: 0; right: 0; top: 470px; text-align: center; color: var(--dark); font-family: var(--serif); font-size: 72px; font-weight: 600; }
.sk-cap { position: absolute; left: 130px; top: 996px; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 26px; border-radius: 32px; background: var(--dark); color: #fff; font-size: 30px; font-weight: 600; white-space: nowrap; }
.sk-cap b { color: var(--accent); }

/* phones */
.phone { position: absolute; top: 96px; width: 412px; height: 880px; border-radius: 52px; background: #0e0b20; padding: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.phone .scr { position: relative; width: 384px; height: 852px; border-radius: 40px; overflow: hidden; background: #fff; }
.phone .scr img.page { position: absolute; left: 0; top: 0; width: 384px; }
.phone .scr .hdr { position: absolute; left: 0; top: 0; width: 384px; overflow: hidden; z-index: 2; }
.phone .scr .hdr img { width: 384px; display: block; }
.ptag { position: absolute; top: 32px; font-size: 24px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
.ptag b { color: var(--accent); }
.pnote { position: absolute; left: 1210px; top: 330px; width: 600px; }
.pnote .n { font-family: var(--serif); font-size: 110px; font-weight: 600; color: var(--accent); line-height: 1; }
.pnote .t { font-size: 34px; font-weight: 600; margin-top: 16px; line-height: 1.25; }
.pnote .s { font-size: 24px; color: var(--soft); margin-top: 18px; }

/* results */
.res { position: absolute; left: 160px; right: 160px; top: 90px; }
.res .ttl { font-family: var(--serif); font-size: 60px; font-weight: 600; }
.res .sub2 { font-size: 26px; color: var(--soft); margin-top: 8px; }
.res .legend { display: flex; gap: 30px; margin-top: 26px; font-size: 22px; color: var(--soft); }
.res .legend i { display: inline-block; width: 18px; height: 18px; border-radius: 4px; margin-right: 8px; vertical-align: -2px; }
.rrow { display: grid; grid-template-columns: 440px 1fr 260px; align-items: center; gap: 28px; margin-top: 30px; }
.rrow .nm { font-size: 30px; font-weight: 600; line-height: 1.15; }
.rrow .nm small { display: block; font-size: 20px; font-weight: 400; color: var(--soft); margin-top: 4px; }
.rrow .bars { display: flex; flex-direction: column; gap: 8px; }
.rrow .b { height: 30px; border-radius: 6px; display: flex; align-items: center; padding-left: 12px; font-size: 20px; font-weight: 700; white-space: nowrap; }
.rrow .b.h { background: #8a86a6; color: #fff; }
.rrow .b.c { background: var(--accent); color: var(--dark); }
.rrow .lift { font-family: var(--serif); font-size: 46px; font-weight: 600; }
.rrow .lift.up { color: var(--accent); }
.rrow .lift.flat { color: var(--soft); font-family: var(--font); font-size: 24px; font-weight: 600; }
.rrow .lift small { display: block; font-family: var(--font); font-size: 18px; color: var(--soft); font-weight: 400; }

/* facts */
.zoom { position: absolute; left: 120px; top: 140px; width: 800px; height: 800px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); background: #fff; }
.zoom img { position: absolute; }
.facts { position: absolute; left: 1000px; top: 230px; width: 780px; display: flex; flex-direction: column; gap: 26px; }
.fact { display: flex; align-items: center; gap: 22px; font-size: 36px; font-weight: 600; line-height: 1.2; }
.fact i { flex: 0 0 56px; height: 56px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-style: normal; font-size: 30px; color: var(--dark); font-weight: 800; }

/* holdout */
.hold { position: absolute; left: 200px; right: 200px; top: 300px; }
.hold .ttl { font-family: var(--serif); font-size: 64px; font-weight: 600; margin-bottom: 40px; }
.hold .row { display: flex; height: 140px; border-radius: 16px; overflow: hidden; font-size: 34px; font-weight: 700; }
.hold .a { background: var(--accent); color: var(--dark); display: flex; align-items: center; padding-left: 40px; }
.hold .b { flex: 1; background: #fff; color: var(--dark); display: flex; align-items: center; justify-content: center; font-size: 26px; white-space: nowrap; }
.hold .cap { font-size: 34px; color: var(--soft); margin-top: 34px; }
</style></head>
<body><div id="stage"></div>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => String(s ?? '').replace(/&(?![a-z#0-9]+;)/gi, '&amp;').replace(/</g, '&lt;');
const html = (s) => String(s ?? ''); // storyboard text that may carry <b>/<em>/<br>

let SB; let CAP; let REVIEW; let SVG; let SCENES = [];
const BW = 1600; // browser content width

/* every scene builds its DOM once (build) and sets styles per frame (frame) */
const TYPES = {};

function at(sc, v, fallback = 0) {
  if (v == null) return fallback;
  if (typeof v === 'number') return v;
  const m = /^([\w-]+)([+-][\d.]+)?$/.exec(v);
  if (m && sc.cues[m[1]] != null) return sc.cues[m[1]] + Number(m[2] || 0);
  return fallback;
}
const ramp = (t, a, d = 0.5) => ease((t - a) / d);
const win = (sc, t, item, d = 0.5) => ramp(t, at(sc, item.at), d) * (item.until != null ? 1 - ramp(t, at(sc, item.until) - d, d) : 1);

/* ---------- title ---------- */
TYPES.title = {
  build: (sc) => `<div class="card-title"><div class="kicker">${html(sc.kicker)}</div><div class="h1">${html(sc.title)}</div>${sc.sub ? `<div class="sub">${html(sc.sub)}</div>` : ''}</div>`,
  frame: (sc, el, t) => { $('.card-title', el).style.opacity = ramp(t, 0.1, 0.8); },
};

/* ---------- stats on the background ---------- */
TYPES.stats = {
  build: (sc) => `<div class="stats-bg">${sc.title ? `<div class="ttl">${html(sc.title)}</div>` : ''}<div class="row">${sc.stats.map((s, i) => `<div class="stat${s.muted ? ' muted' : ''}" data-i="${i}"><div class="n">${esc(s.n)}</div><div class="t">${html(s.t)}</div></div>`).join('')}</div></div>`,
  frame: (sc, el, t) => {
    const ttl = $('.ttl', el); if (ttl) ttl.style.opacity = ramp(t, 0.1, 0.6);
    sc.stats.forEach((s, i) => { const k = win(sc, t, s, 0.6); const c = $(`[data-i="${i}"]`, el); c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 30}px)`; });
  },
};

/* ---------- browser: full-page captures, scrolling, crossfades, rings, stat cards ---------- */
function pageScale(id) { return BW / (CAP[id].width * 1); }
function capBox(ref) { // "capture.mark" → { cap, box }
  const [id, mark] = ref.split('.');
  const box = CAP[id]?.marks?.[mark];
  if (!box) throw new Error(`no mark ${ref} in captures/index.json`);
  return { id, box };
}
function scrollTarget(sc, s) {
  const pg = sc.pageAt(s.at);
  const maxY = Math.max(0, CAP[pg].height - 900 / pageScale(pg));
  // a number up to 1 is a share of the page height ("a quarter of the way down" = 0.25), more is CSS pixels
  if (typeof s.to === 'number') return Math.min(maxY, s.to <= 1 ? s.to * CAP[pg].height : s.to);
  if (typeof s.to === 'string') { const { box } = capBox(s.to.includes('.') ? s.to : `${pg}.${s.to}`); return Math.max(0, box.y - (CAP[pg].header || 0) - 40); }
  return 0;
}
TYPES.browser = {
  build: (sc) => {
    sc.pages = sc.pages || [{ at: 0, page: sc.page, label: sc.label, url: sc.url, sig: sc.sig }];
    sc.pageAt = (a) => { const tt = at(sc, a); let p = sc.pages[0].page; sc.pages.forEach((x) => { if (at(sc, x.at) <= tt) p = x.page; }); return p; };
    return `<div class="chip label"></div><div class="chip sig"></div>
    <div class="browser"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url"></span></div>
      <div class="vp">${sc.pages.map((p, i) => `<div class="pg" data-i="${i}"><img class="page" src="${CAP[p.page].src}"><div class="hdr" style="height:${(CAP[p.page].header || 0) * pageScale(p.page)}px"><img src="${CAP[p.page].src}"></div></div>`).join('')}
        <div class="dim" style="top:${(CAP[sc.pages[0].page].header || 0) * pageScale(sc.pages[0].page)}px"></div>
        <div class="cards" style="top:${(CAP[sc.pages[0].page].header || 0) * pageScale(sc.pages[0].page)}px">${(sc.stats || []).map((s, i) => `<div class="stat${s.muted ? ' muted' : ''}" data-s="${i}"><div class="n">${esc(s.n)}</div><div class="t">${html(s.t)}</div></div>`).join('')}</div>
      </div></div>
    ${(sc.rings || []).map((r, i) => `<div class="ring" data-r="${i}"></div>`).join('')}`;
  },
  frame: (sc, el, t) => {
    // current page and crossfade
    let cur = 0; sc.pages.forEach((p, i) => { if (t >= at(sc, p.at)) cur = i; });
    const k = cur > 0 ? ramp(t, at(sc, sc.pages[cur].at), 0.7) : 1;
    // scroll track (shared by all pages): segments in order
    let y = 0; (sc.scroll || []).forEach((s) => { y = lerp(y, scrollTarget(sc, s), ramp(t, at(sc, s.at), s.dur || 2)); });
    sc.pages.forEach((p, i) => {
      const pe = $(`[data-i="${i}"]`, el);
      pe.style.opacity = i === cur ? (i === 0 ? 1 : k) : (i === cur - 1 ? 1 : 0);
      pe.style.zIndex = i === cur ? 2 : 1;
      $('img.page', pe).style.transform = `translateY(${-y * pageScale(p.page)}px)`;
    });
    const p = sc.pages[cur];
    const label = $('.chip.label', el); label.innerHTML = html(p.label || ''); label.style.display = p.label ? 'flex' : 'none';
    const sig = $('.chip.sig', el); sig.textContent = p.sig || ''; sig.style.display = p.sig ? 'flex' : 'none';
    sig.style.opacity = p.sigAt ? ramp(t, at(sc, p.sigAt), 0.5) : 1;
    $('.url', el).textContent = `${SB.host || ''}${p.url || ''}`;
    $('.browser', el).style.transform = `scale(${lerp(0.97, 1, ramp(t, 0, 1.2))})`;
    // stat cards over a dimmed page
    const stats = sc.stats || [];
    const kd = stats.length ? ramp(t, at(sc, stats[0].at), 0.6) : 0;
    $('.dim', el).style.opacity = kd;
    stats.forEach((s, i) => { const ks = win(sc, t, s, 0.6); const c = $(`[data-s="${i}"]`, el); c.style.opacity = ks; c.style.transform = `translateY(${(1 - ks) * 30}px)`; });
    // rings around marked elements (page coordinates; fixed elements ignore the scroll)
    (sc.rings || []).forEach((r, i) => {
      const { id, box } = capBox(r.mark);
      const s = pageScale(id);
      const yy = box.fixed ? box.y : box.y - y;
      // a mark scrolled out of view (or under the header) gets no ring rather than one pinned to the edge
      const inView = yy + box.h > (CAP[id].header || 0) && yy < 900 / s;
      const o = inView ? win(sc, t, r, 0.5) * (r.pulse ? 0.75 + 0.25 * Math.sin(t * 5) : 1) : 0;
      Object.assign($(`[data-r="${i}"]`, el).style, { left: `${160 + box.x * s - 8}px`, top: `${84 + 44 + yy * s - 8}px`, width: `${box.w * s + 16}px`, height: `${box.h * s + 16}px`, opacity: o });
    });
  },
};

/* ---------- sankey ---------- */
function sankeyEl() {
  const d = document.createElement('div'); d.innerHTML = SVG;
  const svg = d.querySelector('svg'); svg.setAttribute('preserveAspectRatio', 'xMinYMin meet');
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = '<clipPath id="wipe"><rect class="wiperect" x="0" y="0" width="2000" height="1220"/></clipPath>';
  svg.prepend(defs);
  svg.querySelector('.flows').setAttribute('clip-path', 'url(#wipe)');
  return d.innerHTML;
}
const COLX = [62, 495, 928, 1361, 2000];
function paintSankey(el, { reveal = 4, revealK = 1, hi = null, hiPrev = null, hiK = 1 }) {
  const svg = $('svg', el);
  const full = Math.floor(reveal);
  $('.wiperect', el).setAttribute('width', reveal >= 4 ? 2000 : lerp(COLX[full], COLX[full + 1], revealK));
  const colOp = (c) => (c <= full - 1 ? 1 : c === full ? clamp(revealK * 1.4 - 0.2) : 0);
  const on = (set, rules) => !set || rules.split(' ').some((r) => set.includes(r));
  const lit = (set) => { if (!set) return null; const n = new Set(); svg.querySelectorAll('.flow').forEach((p) => { if (on(set, p.dataset.rules)) { n.add(p.dataset.s); n.add(p.dataset.t); } }); return n; };
  const nA = lit(hiPrev); const nB = lit(hi);
  svg.querySelectorAll('.flow').forEach((p) => {
    const a = hiPrev ? (on(hiPrev, p.dataset.rules) ? 0.62 : 0.06) : 0.4;
    const b = hi ? (on(hi, p.dataset.rules) ? 0.62 : 0.06) : 0.4;
    p.style.strokeOpacity = lerp(a, b, hiK);
  });
  svg.querySelectorAll('[data-n]').forEach((e) => {
    const a = nA && !nA.has(e.dataset.n) ? 0.18 : 1; const b = nB && !nB.has(e.dataset.n) ? 0.18 : 1;
    e.style.opacity = colOp(+e.dataset.col) * lerp(a, b, hiK);
  });
  svg.querySelectorAll('.head').forEach((e) => { e.style.opacity = colOp(+e.dataset.col); });
}
TYPES['sankey-reveal'] = {
  layer: 'sk',
  build: (sc) => `${sankeyEl()}${sc.intro ? `<div class="sk-intro">${html(sc.intro)}</div>` : ''}`,
  frame: (sc, el, t) => {
    const cols = sc.columns || ['col1', 'col2', 'col3', 'col4'];
    let reveal = 0; let k = 0;
    cols.forEach((c, i) => { const a = at(sc, c, Infinity); if (t >= a) { reveal = i; k = clamp((t - a) / 2.2); } });
    if (t < at(sc, cols[0], Infinity)) { reveal = 0; k = 0; }
    if (reveal === 3 && k >= 1) reveal = 4;
    paintSankey(el, { reveal, revealK: ease(k) });
    const intro = $('.sk-intro', el); if (intro) intro.style.opacity = ramp(t, 0.1, 0.5) * (1 - ramp(t, at(sc, cols[0], 1e9) - 0.6, 0.6));
  },
};
TYPES['sankey-paths'] = {
  layer: 'sk',
  build: () => `${sankeyEl()}<div class="sk-cap"></div>`,
  frame: (sc, el, t) => {
    const H = sc.highlights || [];
    let cur = -1; H.forEach((h, i) => { if (t >= at(sc, h.at, Infinity)) cur = i; });
    const k = cur >= 0 ? ramp(t, at(sc, H[cur].at), 0.6) : 1;
    paintSankey(el, { reveal: 4, hi: cur >= 0 ? H[cur].rules : null, hiPrev: cur > 0 ? H[cur - 1].rules : null, hiK: k });
    const cap = $('.sk-cap', el);
    cap.innerHTML = cur >= 0 ? html(H[cur].caption || '') : ''; cap.style.opacity = cur >= 0 && H[cur].caption ? k : 0;
  },
};

/* ---------- phones ---------- */
TYPES.phones = {
  build: (sc) => {
    const ph = (side, x) => {
      const c = CAP[sc[side].page]; const hdr = (c.header || 0) * (384 / c.width);
      return `<div class="ptag" data-tag="${side}" style="left:${x}px">${html(sc[side].label || '')}</div>
      <div class="phone" data-ph="${side}" style="left:${x}px"><div class="scr"><img class="page" src="${c.src}"><div class="hdr" style="height:${hdr}px"><img src="${c.src}"></div></div></div>`;
    };
    return `${ph('left', 180)}${ph('right', 680)}${(sc.notes || []).map((n, i) => `<div class="pnote" data-n="${i}"><div class="n">${esc(n.n)}</div><div class="t">${html(n.t)}</div>${n.s ? `<div class="s">${html(n.s)}</div>` : ''}</div>`).join('')}`;
  },
  frame: (sc, el, t) => {
    const kB = ramp(t, at(sc, sc.right.at), 0.7);
    const ax = lerp(754, 180, kB);
    $('[data-ph="left"]', el).style.left = `${ax}px`; $('[data-tag="left"]', el).style.left = `${ax}px`;
    ['[data-ph="right"]', '[data-tag="right"]'].forEach((s) => { $(s, el).style.opacity = kB; });
    $('[data-ph="right"]', el).style.transform = `translateY(${(1 - kB) * 40}px)`;
    // optional: both scroll to their end at the same pace (page length comparison)
    const kS = sc.scrollToEnd ? ramp(t, at(sc, sc.scrollToEnd), 2.6) : 0;
    ['left', 'right'].forEach((side) => {
      const c = CAP[sc[side].page]; const len = c.height * (384 / c.width) - 852;
      $(`[data-ph="${side}"] img.page`, el).style.transform = `translateY(${-lerp(0, len, kS)}px)`;
    });
    (sc.notes || []).forEach((n, i) => { $(`[data-n="${i}"]`, el).style.opacity = win(sc, t, n, 0.6); });
  },
};

/* ---------- results: each rule, holdout vs cohort, from review.json ---------- */
TYPES.results = {
  build: (sc) => {
    const want = sc.rules || REVIEW.rules.filter((r) => r.id !== 'none').map((r) => r.id);
    sc.rows = want.map((id) => REVIEW.rules.find((r) => r.id === id)).filter(Boolean);
    const max = Math.max(0.05, ...sc.rows.flatMap((r) => [r.control.goalRate, r.cohort.goalRate]));
    const pct = (x) => `${(x * 100).toFixed(1)}%`;
    const goal = (r) => (sc.goalLabels || {})[r.id] || (r.goal.click ? `clicked ${r.goal.click.split('|')[0]}` : r.goal.navigate ? 'went on to another page' : r.goal.checkpoint || 'clicked');
    return `<div class="res"><div class="ttl">${html(sc.title || 'Each cohort against its holdout')}</div>
      <div class="sub2">${html(sc.sub || '')}</div>
      <div class="legend"><span><i style="background:#8a86a6"></i>Holdout: original page</span><span><i style="background:var(--accent)"></i>Cohort experience</span></div>
      ${sc.rows.map((r, i) => `<div class="rrow" data-row="${i}">
        <div class="nm">${esc(r.label)}<small>${esc(goal(r))} · ${(r.share * 100).toFixed(1)}% of views</small></div>
        <div class="bars"><div class="b h" data-w="${r.control.goalRate / max}">${pct(r.control.goalRate)}</div><div class="b c" data-w="${r.cohort.goalRate / max}">${pct(r.cohort.goalRate)}</div></div>
        <div class="lift ${r.significant && r.lift > 0 ? 'up' : r.significant ? 'down' : 'flat'}">${r.lowSample ? 'not enough data yet' : r.significant ? `${r.lift > 0 ? '+' : ''}${Math.round(r.lift * 100)}%<small>significant (p ${r.p < 0.001 ? '< 0.001' : `= ${r.p.toFixed(3)}`})</small>` : 'no clear difference yet'}</div>
      </div>`).join('')}</div>`;
  },
  frame: (sc, el, t) => {
    $('.res .ttl', el).style.opacity = ramp(t, 0.1, 0.6);
    sc.rows.forEach((r, i) => {
      const a = sc.rowCues?.[i] != null ? at(sc, sc.rowCues[i]) : 0.8 + i * 0.9;
      const row = $(`[data-row="${i}"]`, el); row.style.opacity = ramp(t, a, 0.5);
      row.querySelectorAll('.b').forEach((b) => { b.style.width = `max(90px, ${100 * Number(b.dataset.w) * ramp(t, a + 0.2, 1.2)}%)`; });
      $('.lift', row).style.opacity = ramp(t, a + 1.2, 0.5);
    });
  },
};

/* ---------- facts: zoom into a capture, list beside it ---------- */
TYPES.facts = {
  build: (sc) => `<div class="zoom"><img src="${CAP[sc.image].src}"></div><div class="facts">${sc.facts.map((f, i) => `<div class="fact" data-f="${i}"><i>${i + 1}</i>${html(f.text)}</div>`).join('')}</div>`,
  frame: (sc, el, t) => {
    const c = CAP[sc.image];
    const box = sc.zoomTo ? capBox(sc.zoomTo).box : { x: c.width / 2 - 200, y: 540 - 200, w: 400, h: 400 };
    const z = ramp(t, at(sc, sc.zoomAt, 0.3), 2.2);
    // no more than 2x the capture's own pixels: a small button blown up to fill the frame turns to mush
    const scale = lerp(800 / c.width, Math.min(760 / Math.max(box.w, box.h), 2 * (c.scale || 1)), z);
    const fx = lerp(c.width / 2, box.x + box.w / 2, z); const fy = lerp(Math.min(c.height, 1080) / 2, box.y + box.h / 2, z);
    Object.assign($('.zoom img', el).style, { width: `${c.width * scale}px`, left: `${400 - fx * scale}px`, top: `${400 - fy * scale}px` });
    sc.facts.forEach((f, i) => { $(`[data-f="${i}"]`, el).style.opacity = win(sc, t, f, 0.5); });
  },
};

/* ---------- holdout ---------- */
TYPES.holdout = {
  build: (sc) => { const split = sc.split || 90; return `<div class="hold"><div class="ttl">${html(sc.title || 'Every rule is measured.')}</div><div class="row"><div class="a" style="flex:0 0 ${split}%">${split}% · cohort experience</div><div class="b">${100 - split}% · original</div></div><div class="cap">${html(sc.caption || 'The holdout keeps the original page, so Optel compares the two, rule by rule.')}</div></div>`; },
  frame: (sc, el, t) => { $('.hold', el).style.opacity = ramp(t, 0.1, 0.6); },
};

/* ---------- runtime ---------- */
window.init = async ({ storyboard, captures, svg, review, cues }) => {
  SB = storyboard; CAP = captures; SVG = svg; REVIEW = review;
  if (SB.brand) Object.entries(SB.brand).forEach(([k, v]) => document.documentElement.style.setProperty(`--${k}`, v));
  if (SB.fonts) {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = SB.fonts; document.head.append(l);
  }
  const stage = $('#stage');
  SCENES = SB.scenes.map((sc0) => {
    const sc = { ...sc0, cues: cues[sc0.id] || {} };
    const T = TYPES[sc.type];
    if (!T) throw new Error(`unknown scene type ${sc.type}`);
    const el = document.createElement('div');
    el.className = `layer ${T.layer || ''}`;
    el.innerHTML = T.build(sc);
    stage.append(el);
    return { sc, el, T };
  });
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await document.fonts.ready;
  return SCENES.length;
};
window.render = (i, t) => {
  SCENES.forEach((s, j) => { s.el.style.display = j === i ? 'block' : 'none'; });
  const s = SCENES[i]; s.T.frame(s.sc, s.el, t);
};
</script>
</body></html>
